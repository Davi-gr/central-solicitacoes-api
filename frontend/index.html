<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Central de Solicitações</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Central de Solicitações</h1>
  </header>

  <main>
    <section class="resumo" aria-label="Resumo das solicitações">
      <button type="button" class="card" data-status="">
        <span class="card-numero" id="resumo-total">0</span>
        <span class="card-rotulo">Total</span>
      </button>
      <button type="button" class="card" data-status="Aberta">
        <span class="card-numero" id="resumo-aberta">0</span>
        <span class="card-rotulo">Abertas</span>
      </button>
      <button type="button" class="card" data-status="Em andamento">
        <span class="card-numero" id="resumo-andamento">0</span>
        <span class="card-rotulo">Em andamento</span>
      </button>
      <button type="button" class="card" data-status="Concluída">
        <span class="card-numero" id="resumo-concluida">0</span>
        <span class="card-rotulo">Concluídas</span>
      </button>
    </section>
    <section>
      <h2>Nova solicitação</h2>
      <form id="form-solicitacao" novalidate>
        <label for="titulo">Título</label>
        <input type="text" id="titulo" name="titulo">

        <label for="descricao">Descrição</label>
        <textarea id="descricao" name="descricao" rows="3"></textarea>

        <label for="categoria">Categoria</label>
        <input type="text" id="categoria" name="categoria">

        <label for="prioridade">Prioridade</label>
        <select id="prioridade" name="prioridade">
          <option value="">Selecione...</option>
          <option value="baixa">Baixa</option>
          <option value="media">Média</option>
          <option value="alta">Alta</option>
        </select>

        <button type="submit">Cadastrar</button>
      </form>

      <div id="mensagem" role="alert"></div>
    </section>

    <section>
      <h2>Solicitações</h2>

      <div class="filtros">
        <label for="filtro-busca">Buscar</label>
        <input
          type="search"
          id="filtro-busca"
          placeholder="Buscar por título ou descrição..."
        >

        <label for="filtro-status">Status</label>
        <select id="filtro-status">
          <option value="">Todos</option>
          <option value="Aberta">Aberta</option>
          <option value="Em andamento">Em andamento</option>
          <option value="Concluída">Concluída</option>
        </select>

        <label for="filtro-prioridade">Prioridade</label>
        <select id="filtro-prioridade">
          <option value="">Todas</option>
          <option value="baixa">Baixa</option>
          <option value="media">Média</option>
          <option value="alta">Alta</option>
        </select>

        <button type="button" id="limpar-filtros">Limpar filtros</button>
      </div>

      <div class="tabela-wrapper">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Título</th>
              <th>Categoria</th>
              <th>Prioridade</th>
              <th>Status</th>
              <th>Criada em</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="lista"></tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog id="dialogo" aria-labelledby="d-titulo">
    <div class="dialogo-conteudo">
      <h2 id="d-titulo"></h2>

      <dl>
        <dt>ID</dt>
        <dd id="d-id"></dd>
        <dt>Descrição</dt>
        <dd id="d-descricao"></dd>
        <dt>Categoria</dt>
        <dd id="d-categoria"></dd>
        <dt>Prioridade</dt>
        <dd id="d-prioridade"></dd>
        <dt>Status</dt>
        <dd id="d-status"></dd>
        <dt>Criada em</dt>
        <dd id="d-criado"></dd>
      </dl>

      <div id="mensagem-detalhe" role="alert"></div>

      <div class="acoes">
        <button type="button" id="botao-avancar"></button>
        <button type="button" id="botao-fechar">Fechar</button>
      </div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
